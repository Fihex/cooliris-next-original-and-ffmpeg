appId: com.coolirisnext.app
productName: Cooliris Next
directories:
  output: release
  buildResources: build
# Vite emits the renderer to dist/ and the main/preload to dist-electron/. The libVLC
# layer needs the native addon + the host script shipped and unpacked (spawned/dlopen'd).
files:
  - dist/**
  - dist-electron/**
  - electron/vlcHost.cjs
  - native/build/Release/vlc.node
asarUnpack:
  - electron/vlcHost.cjs
  - native/build/Release/vlc.node
# Self-contained runtime (Node + libVLC + plugins), generated by scripts/bundle-linux.sh.
extraResources:
  - from: vendor
    to: vendor
linux:
  target: AppImage
  category: Graphics
win:
  target: nsis
mac:
  target: dmg
  category: public.app-category.graphics-design
