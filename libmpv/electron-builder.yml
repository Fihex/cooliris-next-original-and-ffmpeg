appId: com.coolirisnext.app
productName: Cooliris Next
directories:
  output: release
  buildResources: build
# Vite emits the renderer to dist/ and the main/preload to dist-electron/. The libmpv
# layer needs the native addon + the host script shipped and unpacked (spawned/dlopen'd).
files:
  - dist/**
  - dist-electron/**
  - electron/mpvHost.cjs
  - native/build/Release/mpv.node
asarUnpack:
  - electron/mpvHost.cjs
  - native/build/Release/mpv.node
# Self-contained runtime (Node + libmpv + deps), generated by scripts/bundle-linux.sh.
extraResources:
  - from: vendor
    to: vendor
linux:
  target: AppImage
  category: Graphics
win:
  target: nsis
  # Ship start.bat NEXT TO the exe (extraFiles → app root; extraResources would bury it under
  # resources\). Double-clicking it launches with COOLIRIS_MPV_EMBED=1 (native two-window video).
  extraFiles:
    - from: start.bat
      to: start.bat
mac:
  target: dmg
  category: public.app-category.graphics-design
