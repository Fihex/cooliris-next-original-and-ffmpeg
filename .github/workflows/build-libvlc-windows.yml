# Builds the libVLC edition for Windows on a real Windows runner (the native addon
# needs MSVC, so it cannot be cross-built from Linux/Wine). Produces the NSIS installer
# and the unpacked folder as downloadable artifacts.
#
# Run it from GitHub → Actions → "build libvlc (Windows)" → Run workflow,
# or just push a tag like `libvlc-win-1` (no Actions UI / token needed).
name: build libvlc (Windows)

on:
  workflow_dispatch: {}
  push:
    tags:
      - 'libvlc-win-*'

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download official VLC (SDK + DLLs + plugins)
        shell: pwsh
        working-directory: libvlc
        run: |
          # get.videolan.org geo-redirects to a mirror; many mirrors carry only the
          # .7z (no .zip), so fetch the .7z (universally mirrored) and extract with the
          # 7-Zip that ships on windows runners. Retry to ride out a flaky mirror.
          $ver = "3.0.21"
          $url = "https://get.videolan.org/vlc/$ver/win64/vlc-$ver-win64.7z"
          $ok = $false
          for ($i = 1; $i -le 4; $i++) {
            try {
              Write-Host "Download attempt $i : $url"
              Invoke-WebRequest -Uri $url -OutFile vlc.7z -MaximumRedirection 6 -UseBasicParsing
              if ((Get-Item vlc.7z).Length -gt 30MB) { $ok = $true; break }
              Write-Host "file too small, retrying"
            } catch { Write-Host "attempt $i failed: $($_.Exception.Message)" }
            Start-Sleep -Seconds 6
          }
          if (-not $ok) { throw "VLC download failed after retries" }
          & 'C:\Program Files\7-Zip\7z.exe' x vlc.7z -y | Out-Null
          if (-not (Test-Path ".\vlc-$ver")) { throw "extraction did not produce vlc-$ver" }

      - name: Install dependencies
        working-directory: libvlc
        run: npm install

      - name: Prepare VLC SDK (headers + import libs)
        shell: pwsh
        working-directory: libvlc
        run: pwsh scripts/setup-windows.ps1 -VlcDir (Resolve-Path .\vlc-3.0.21)

      - name: Build native addon (vlc.node)
        working-directory: libvlc/native
        run: npx node-gyp rebuild

      - name: Bundle self-contained runtime (node.exe + libvlc + plugins)
        shell: pwsh
        working-directory: libvlc
        run: pwsh scripts/bundle-windows.ps1 -VlcDir (Resolve-Path .\vlc-3.0.21)

      - name: Build renderer + main
        shell: pwsh
        working-directory: libvlc
        run: |
          $env:ELECTRON = "1"
          npm run build

      - name: Package (NSIS installer + unpacked folder)
        working-directory: libvlc
        run: npx electron-builder --win nsis dir

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: cooliris-libvlc-windows-installer
          path: libvlc/release/*.exe

      - name: Upload unpacked folder
        uses: actions/upload-artifact@v4
        with:
          name: cooliris-libvlc-windows-unpacked
          path: libvlc/release/win-unpacked/**
