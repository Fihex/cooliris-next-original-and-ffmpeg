# Builds the libVLC edition for Windows on a real Windows runner (the native addon
# needs MSVC, so it cannot be cross-built from Linux/Wine). Produces the NSIS installer
# and the unpacked folder as downloadable artifacts.
#
# Run it from GitHub → Actions → "build libvlc (Windows)" → Run workflow,
# or just push a tag like `libvlc-win-1` (no Actions UI / token needed).
name: build libvlc (Windows)

on:
  workflow_dispatch: {}
  push:
    tags:
      - 'libvlc-win-*'

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download official VLC (SDK + DLLs + plugins)
        shell: pwsh
        working-directory: libvlc
        run: |
          $ErrorActionPreference = "Stop"
          # get.videolan.org geo-redirects to a mirror; many mirrors carry only the .7z
          # (no .zip) and some redirect https->http, which pwsh's Invoke-WebRequest
          # refuses. curl.exe (preinstalled) follows those redirects, so use it.
          $ver = "3.0.21"
          $url = "https://get.videolan.org/vlc/$ver/win64/vlc-$ver-win64.7z"
          Write-Host "Downloading $url"
          curl.exe -L --fail --retry 5 --retry-all-errors --connect-timeout 30 -o vlc.7z $url
          if ($LASTEXITCODE -ne 0) { throw "curl failed ($LASTEXITCODE)" }
          $size = (Get-Item vlc.7z).Length
          Write-Host "Downloaded vlc.7z = $size bytes"
          if ($size -lt 30MB) { throw "vlc.7z too small ($size)" }
          # Locate 7-Zip (present on GitHub windows images; path-robust just in case).
          $sevenzip = (Get-Command 7z.exe -ErrorAction SilentlyContinue).Source
          if (-not $sevenzip) { $sevenzip = "C:\Program Files\7-Zip\7z.exe" }
          if (-not (Test-Path $sevenzip)) { throw "7-Zip not found" }
          & $sevenzip x vlc.7z -y -bso0 -bsp0
          if ($LASTEXITCODE -ne 0) { throw "7z extract failed ($LASTEXITCODE)" }
          if (-not (Test-Path ".\vlc-$ver")) { throw "extraction did not produce vlc-$ver" }
          Write-Host "Extracted to vlc-$ver"

      - name: Install dependencies
        working-directory: libvlc
        run: npm install

      - name: Prepare VLC SDK (headers + import libs)
        shell: pwsh
        working-directory: libvlc
        run: pwsh scripts/setup-windows.ps1 -VlcDir (Resolve-Path .\vlc-3.0.21)

      - name: Build native addon (vlc.node)
        working-directory: libvlc/native
        run: npx node-gyp rebuild

      - name: Bundle self-contained runtime (node.exe + libvlc + plugins)
        shell: pwsh
        working-directory: libvlc
        run: pwsh scripts/bundle-windows.ps1 -VlcDir (Resolve-Path .\vlc-3.0.21)

      - name: Build renderer + main
        shell: pwsh
        working-directory: libvlc
        run: |
          $env:ELECTRON = "1"
          npm run build

      - name: Package (NSIS installer + unpacked folder)
        working-directory: libvlc
        run: npx electron-builder --win nsis dir

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: cooliris-libvlc-windows-installer
          path: libvlc/release/*.exe

      - name: Upload unpacked folder
        uses: actions/upload-artifact@v4
        with:
          name: cooliris-libvlc-windows-unpacked
          path: libvlc/release/win-unpacked/**
