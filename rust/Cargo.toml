[package]
name = "cooliris-rs"
version = "0.1.0"
edition = "2021"
description = "Native Rust + wgpu rebuild of the Cooliris 3D media wall"
autobins = false
default-run = "cooliris-rs" # so `cargo run` launches the wall (not the `video` proof bin)

# The wall (default). Builds with no libmpv dependency.
[[bin]]
name = "cooliris-rs"
path = "src/main.rs"

# libmpv → wgpu video proof. Opt-in: `cargo run --features video --bin video -- clip.mp4`.
[[bin]]
name = "video"
path = "src/bin/video.rs"
required-features = ["video"]

[features]
# Enables the libmpv video path (and links libmpv via build.rs).
video = []

[dependencies]
# Cross-platform windowing + input (Win/macOS/Linux). 0.30 uses the ApplicationHandler model.
winit = "0.30"
# Cross-platform GPU (Vulkan / Metal / DX12 / GL) — the wall renders here, no browser involved.
wgpu = "22"
# Block on wgpu's async device/adapter requests from sync winit callbacks.
pollster = "0.3"
# Plain-old-data structs → GPU buffers without unsafe transmutes.
bytemuck = { version = "1", features = ["derive"] }
# Math (camera / transforms) for the 3D wall.
glam = "0.29"
# Image decode + downscale, run on the streaming worker pool.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
# Multi-producer/multi-consumer channels for the decode worker pool (jobs out, pixels back).
crossbeam-channel = "0.5"
log = "0.4"
env_logger = "0.11"
# Native folder picker, so the app runs without a CLI path. xdg-portal backend on Linux avoids a
# GTK build dependency; Windows/macOS use their native dialogs.
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }
# GPU text (the Open button label + the loaded/total readout). Matches wgpu 22.
glyphon = "0.6"

[build-dependencies]
# Finds + links libmpv when the `video` feature is on.
pkg-config = "0.3"

# Faster debug builds of the heavy graphics deps without losing our own debuggability.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
